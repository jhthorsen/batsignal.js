<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plot plugin — batsignal.js</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.amber.min.css">
  <link rel="stylesheet" href="../batsignal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/themes/prism-tomorrow.min.css">
  <style>
    [data-line-chart] {
      position: relative;
      width: 100%;
      max-width: 48rem;
      aspect-ratio: 16 / 9;

      .plot-tooltip {
        background: var(--pico-color);
        color: var(--pico-background-color);
        padding: .25rem .5rem;
        border-radius: .25rem;
        position: absolute;
        z-index: 1;
        font-size: .8rem;
        pointer-events: none;
        white-space: nowrap;
        transform: translate(-50%, -100%);
        opacity: 0;
        transition: opacity .3s ease;
      }

      .plot-tooltip.is-visible {
        opacity: 1;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .plot-grid {
        stroke: currentColor;
        opacity: .18;
      }

      .plot-axis {
        stroke: currentColor;
        opacity: .65;
      }

      .plot-label {
        fill: currentColor;
        font: 12px sans-serif;
      }

    }

    .plot-legend {
      padding: 0;
      margin: var(--pico-spacing) 0;
      display: flex;
      justify-content: center;
      gap: var(--pico-spacing);

      li {
        margin: 0;
        list-style: none;
      }
    }

    .plot-legend li::before {
      background: var(--plot-color);
      content: '';
      display: inline-block;
      width: .8em;
      height: .8em;
      margin-right: .4em;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <p class="site-header__eyebrow">HTML-first interactivity</p>
    <h1>🦇 batsignal.js</h1>
    <div class="grid" style="margin:2rem auto;width:20rem"><a href="../index.html" role="button">Home</a><a
        href="https://github.com/jhthorsen/batsignal.js#readme" role="button" class="secondary">Documentation</a></div>
  </header>
  <main class="container">
    <h1>Plot plugin</h1>
    <p>Dispatch <code>plot</code> events with a legend and numeric coordinates. Each series is drawn as an SVG line, and
      the chart range expands to include every point.</p>
    <div id="chart" on:load data-line-chart data-x-suffix="s" data-y-suffix="L">
      <svg viewBox="0 0 640 360" data-margin="18 18 18 58" role="img" aria-labelledby="plot-title plot-description">
        <title id="plot-title">Line chart</title>
        <desc id="plot-description">Line chart with Moonlight and Bat Signal series. Horizontal values use seconds (s).
          Vertical values use liters (L).</desc>
        <g class="plot-graphics"></g>
      </svg>
      <div class="plot-tooltip" role="status" aria-live="polite" data-template="{legend}: {x}{xSuffix}, {y}{ySuffix}">
      </div>
    </div>
    <ul class="plot-legend" aria-label="Chart legend">
      <li style="--plot-color: #f5a623">Moonlight</li>
      <li style="--plot-color: #4bc0c0">Bat Signal</li>
    </ul>
    <button type="button" on:load
      on:click="const chart = $('#chart'); chart.plotX ??= {}; ctx.dispatch(chart, 'plot', {legend: 'Moonlight', x: chart.plotX.moonlight = (chart.plotX.moonlight ?? -1) + 1, y: Math.round(Math.random() * 30)})">Add
      Moonlight point</button>
    <button type="button" class="secondary" on:load
      on:click="const chart = $('#chart'); chart.plotX ??= {}; ctx.dispatch(chart, 'plot', {legend: 'Bat Signal', x: chart.plotX.batSignal = (chart.plotX.batSignal ?? -1) + 1, y: Math.round(Math.random() * 30)})">Add
      Bat Signal point</button>
    <button type="button" class="secondary" on:load on:click="ctx.dispatch($('#chart'), 'reset')">Clear
      chart</button>
  </main>
  <script type="text/plain" data-batsignal-plugin="plot">
({
  charts: new WeakMap(),
  init(el, ctx) {
    if (!el.hasAttribute('data-line-chart')) return

    const legends = [...document.querySelectorAll('.plot-legend li')].map(item => ({
      name: item.textContent.trim(),
      color: getComputedStyle(item).getPropertyValue('--plot-color').trim(),
    }))

    const domain = {minX: 0, maxX: 10, minY: 0, maxY: 10}
    this.charts.set(el, {
      legends,
      series: new Map(legends.map(({name}) => [name, []])),
      domain: Object.assign({}, domain),
    })

    const observer = new ResizeObserver(() => {
      el.querySelector('.plot-tooltip').classList.remove('is-visible')
      this.draw(el)
    })
    observer.observe(el)
    this.charts.get(el).observer = observer

    ctx.listen(el, 'plot', event => {
      const {legend, x, y} = event.detail ?? {}
      if (legend == null || !Number.isFinite(Number(x)) || !Number.isFinite(Number(y))) return
      const values = this.charts.get(el).series.get(String(legend))
      if (!values) return
      values.push({x: Number(x), y: Number(y)})
      this.draw(el)
    })

    ctx.listen(el, 'reset', () => {
      const chart = this.charts.get(el)
      for (const values of chart.series.values()) values.length = 0
      Object.assign(chart.domain, domain)
      el.plotX = {}
      this.draw(el)
    })

    this.draw(el)
  },
  element(tagname) {
    return document.createElementNS('http://www.w3.org/2000/svg', tagname)
  },
  draw(el) {
    const {legends, series, domain} = this.charts.get(el)
    const svg = el.querySelector('svg')
    const graphics = el.querySelector('.plot-graphics')
    const tooltip = el.querySelector('.plot-tooltip')
    const {width, height} = svg.viewBox.baseVal
    const [top, right, bottom, left] = svg.dataset.margin.split(/\s+/).map(Number)
    const plotWidth = width - left - right, plotHeight = height - top - bottom
    const points = [...series.values()].flat()

    let minX = domain.minX, maxX = domain.maxX
    let minY = domain.minY, maxY = domain.maxY
    for (const point of points) {
      if (point.x < minX) minX = Math.floor(point.x / 10) * 10
      if (point.x > maxX) maxX = Math.ceil(point.x / 10) * 10 || 10
      if (point.y < minY) minY = Math.floor(point.y / 10) * 10
      if (point.y > maxY) maxY = Math.ceil(point.y / 10) * 10 || 10
    }

    Object.assign(domain, {minX, maxX, minY, maxY})

    const x = value => left + (value - minX) / (maxX - minX) * plotWidth
    const y = value => top + (maxY - value) / (maxY - minY) * plotHeight
    const make = (name, attrs = {}, text) => {
      const node = this.element(name)
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value)
      if (text !== undefined) node.textContent = text
      return node
    }

    graphics.replaceChildren()

    for (let i = 0; i <= 4; i++) {
      const valueY = minY + (maxY - minY) * i / 4
      const yy = y(valueY)
      graphics.append(make('line', {x1: left, x2: width - right, y1: yy, y2: yy, class: 'plot-grid'}))
      graphics.append(make('text', {x: left - 8, y: yy + 4, 'text-anchor': 'end', class: 'plot-label'}, `${Number(valueY.toPrecision(3))}${el.dataset.ySuffix ?? ''}`))
      const valueX = minX + (maxX - minX) * i / 4
      const xx = x(valueX)
      graphics.append(make('line', {x1: xx, x2: xx, y1: top, y2: height - bottom, class: 'plot-grid'}))
      graphics.append(make('text', {x: xx, y: height - bottom + 20, 'text-anchor': 'middle', class: 'plot-label'}, `${Number(valueX.toPrecision(3))}${el.dataset.xSuffix ?? ''}`))
    }

    graphics.append(make('line', {x1: left, x2: left, y1: top, y2: height - bottom, class: 'plot-axis'}))
    graphics.append(make('line', {x1: left, x2: width - right, y1: height - bottom, y2: height - bottom, class: 'plot-axis'}))

    for (const {name: legend, color} of legends) {
      const values = series.get(legend)
      const sorted = [...values].sort((a, b) => a.x - b.x)
      if (sorted.length > 1) {
        const path = sorted.map((point, i) => `${i ? 'L' : 'M'}${x(point.x)},${y(point.y)}`).join(' ')
        graphics.append(make('path', {d: path, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}))
      }
      for (const point of sorted) {
        const label = `${legend}: ${point.x}${el.dataset.xSuffix ?? ''}, ${point.y}${el.dataset.ySuffix ?? ''}`
        const circle = make('circle', {cx: x(point.x), cy: y(point.y), r: 4, fill: color, tabindex: 0, role: 'img', 'aria-label': label})
        circle.append(make('title', {}, label))
        circle.addEventListener('pointerenter', () => this.showTooltip(el, circle, legend, point))
        circle.addEventListener('pointerleave', () => tooltip.classList.remove('is-visible'))
        circle.addEventListener('focus', () => this.showTooltip(el, circle, legend, point))
        circle.addEventListener('blur', () => tooltip.classList.remove('is-visible'))
        graphics.append(circle)
      }
    }
  },
  showTooltip(el, circle, legend, point) {
    const tooltip = el.querySelector('.plot-tooltip')
    const tooltipFormat = tooltip.dataset.template || '{legend}: {x}{xSuffix}, {y}{ySuffix}'
    const values = {
      legend,
      x: Number(point.x.toPrecision(3)),
      y: Number(point.y.toPrecision(3)),
      xSuffix: el.dataset.xSuffix ?? '',
      ySuffix: el.dataset.ySuffix ?? '',
    }
    tooltip.textContent = tooltipFormat.replace(/\{(legend|x|y|xSuffix|ySuffix)\}/g, (_, key) => values[key])

    const chartRect = el.getBoundingClientRect()
    const pointRect = circle.getBoundingClientRect()
    tooltip.style.left = `${pointRect.left + pointRect.width / 2 - chartRect.left}px`
    tooltip.style.top = `${pointRect.top - chartRect.top}px`
    tooltip.classList.add('is-visible')
  },
})
  </script>
  <section class="container">
    <h2>Plugin code</h2>
    <pre><code id="plugin-code" class="language-javascript"></code></pre>
    <button type="button" class="copy-plugin-code">Copy code</button>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js"></script>
  <script>
    (() => {
      const code = document.querySelector('#plugin-code')
      code.textContent = document.querySelector('script[data-batsignal-plugin]').outerHTML
      Prism.highlightElement(code)
      const copyButton = document.querySelector('.copy-plugin-code')
      copyButton.addEventListener('click', async () => {
        await navigator.clipboard.writeText(code.textContent)
        copyButton.textContent = 'Copied!'
        setTimeout(() => {copyButton.textContent = 'Copy code'}, 1500)
      })
    })()
  </script>
  <script src="https://unpkg.com/idiomorph@0.7.4/dist/idiomorph.min.js"></script>
  <script src="../batsignal.js"></script>
</body>

</html>
